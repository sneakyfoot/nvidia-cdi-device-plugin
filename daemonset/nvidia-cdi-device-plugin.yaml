---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvidia-cdi-dra
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nvidia-cdi-dra
rules:
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nvidia-cdi-dra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvidia-cdi-dra
subjects:
  - kind: ServiceAccount
    name: nvidia-cdi-dra
    namespace: kube-system
---
# Backwards-compat: pods using `resources.limits.nvidia.com/gpu: 1` are routed
# to this DeviceClass via KEP-5004 (DRAExtendedResource feature gate).
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu.nvidia.com
spec:
  selectors:
    - cel:
        expression: device.driver == 'gpu.nvidia.com'
  extendedResourceName: nvidia.com/gpu
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-cdi-dra
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: nvidia-cdi-dra
  template:
    metadata:
      labels:
        app: nvidia-cdi-dra
    spec:
      serviceAccountName: nvidia-cdi-dra
      hostPID: true
      nodeSelector:
        oom/nix: "true"
      tolerations:
        - operator: Exists
      containers:
        - name: dra-driver
          image: ghcr.io/sneakyfoot/nvidia-cdi-device-plugin:0.2.0
          imagePullPolicy: Always
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: RUST_LOG
              value: info
          args:
            - "--driver-name=gpu.nvidia.com"
            - "--device-class=gpu.nvidia.com"
            - "--extended-resource-name=nvidia.com/gpu"
            - "--kubelet-dir=/var/lib/kubelet"
            - "--cdi-kind=nvidia.com/gpu"
            - "--exclude-display-gpus"
            - "--nvml-lib-path=/run/opengl-driver/lib/libnvidia-ml.so.1"
          volumeMounts:
            - name: kubelet-plugins
              mountPath: /var/lib/kubelet/plugins
            - name: kubelet-plugins-registry
              mountPath: /var/lib/kubelet/plugins_registry
            - name: nixos-driver
              mountPath: /run/opengl-driver
              readOnly: true
            - name: dev
              mountPath: /dev
              readOnly: true
      volumes:
        - name: kubelet-plugins
          hostPath:
            path: /var/lib/kubelet/plugins
            type: DirectoryOrCreate
        - name: kubelet-plugins-registry
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: DirectoryOrCreate
        - name: nixos-driver
          hostPath:
            path: /run/opengl-driver
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory

[package]
name = "nvidia-cdi-device-plugin"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive", "env"] }
futures = "0.3.31"
hyper-util = { version = "0.1.19", features = ["tokio"] }
k8s-openapi = { version = "0.27.1", features = ["v1_34"] }
kube = { version = "3.1.0", default-features = false, features = ["client", "rustls-tls", "runtime"] }
nvml-wrapper = "0.12.1"
prost = "0.14.1"
prost-types = "0.14.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "fs", "time"] }
tokio-stream = { version = "0.1.15", features = ["net"] }
tonic = "0.14.2"
tonic-prost = "0.14.2"
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14.1"
protoc-bin-vendored = "3.1.0"
tonic-prost-build = "0.14.2"
